<!DOCTYPE html>
<html lang="en">
<head>
     <title> Timer </title>
     <style> 
     body {
          text-align: center;
          background-color: black;
          color: white;
          margin: 0;
          }
     #settingsBtn {
          position: fixed;
          top: 20px;
          left: 20px;
          z-index:10;
     }
     #settingsPanel {
          display: none; 
          position:fixed;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          width: 460px;
          max-width: 90vw;
          max-height: 85vh;
          overflow-y: auto;
          height: auto;
          padding: 32px 36px 36px;
          border-radius: 14px;
          box-shadow: 0 12px 40px rgba(0,0,0,0.6);
          box-sizing: border-box;
          z-index: 200;
          background-color:#1e1e1e;
          text-align: left;
     }
     #settingsPanel.show {
          display: block;
     }
     #banner {
          background-color: #1e1e1e;
          color: white;
          padding: 20px;
          font-size: 24px;
          font-weight: bold;
          height: 200px;
          background-image: URL("404\ This\ Page\ cannot\ be\ found\ banner.jpg");
          background-size: cover;
          background-position: center;

     }
     #progressBar {
          position: relative;
          width: 60%;
          height: 12px;
          margin: 20px auto 40px;
          background-color: #333;
          border-radius: 6px;
     }
     #progressFill {
          width: 0%;
          height: 100%;
          background-color: orange;
          border-radius: 6px;
          transition: width 0.3s linear;
     }
     
     #cat {
          position: absolute;
          top: -26px;
          left: 0%;
          font-size: 28px;
          transition: left 0.3s linear;
          transform: translateX(-50%);
     }
     #settingsPanel label {
          display: block;
          margin: 0 0 8px;
          font-size: 15px;
          font-weight: 600;
     }
     #settingsPanel > div {
          margin-bottom: 24px;
     }

     #settingsPanel input[type = "file"],
     #settingsPanel input[type= "number"] {
          display: block;
          width: 100%;
          box-sizing: border-box;
     }
     #settingsPanel input[type = "checkbox"] {
          display: block;
          width: 18px;
          height: 18px;
          margin: 0;
     }
     #settingsPanel input[type = "color"] {
          display: block;
          width: 100%;
          height: 44px;
          padding: 0;
          border: none;
          border-radius: 8px;
          background: none;
          cursor: pointer;
     }
     #sideTabs {
          position: fixed;
          top: 240px;
          left: 0;
          z-index: 150;
          display: flex;
          flex-direction: column;
          gap: 8px;
     }

     .tab {
          width: 26px;
          height: 90px;
          background-color: #1e1e1e;
          color: white;
          border-radius: 0 10px 10px 0;
          display: flex;
          align-items: center;
          justify-content: center;
          cursor: pointer;
          transition: width 0.25s ease;
          box-shadow: 2px 2px 10px rgba(0,0,0,0.5);
     }
     .tab:hover, .tab.active {
          width: 60px;
     }
     .tabLabel {
          writing-mode: vertical-rl;
          transform: rotate(180deg);
          font-size: 14px;
          font-weight: 600;
          white-space: nowrap;
     }
     .sidePanel {
          position: fixed;
          top: 240px;
          left: 380px;
          width: 300px;
          max-height: 70vh;
          overflow-y: auto;
          padding: 20px;
          background-color: #1e1e1e;
          color: white;
          border-radius: 0 14px 14px 0;
          box-shadow: 4px 4px 20px rgba(0,0,0,0.6);
          transition: transform 0.3s ease, opacity 0.3s ease, visibility 0.3s;
          z-index: 100;
          text-align: left;
          transform: translateX(-20px);
          box-sizing: border-box;
          opacity: 0;
          visibility: hidden;
          pointer-events: none;
          
     
     }
     .sidePanel.open {
          opacity: 1;
          visibility: visible;
          pointer-events:  none;
          transform: translateX(0);
     }
     #settingsPanel.show ~ .tab {
          left: 380px;

     }
     body:has(#settingsPanel.show) .sidePanel {
          left: 380px;
     }
     body:has(#settingsPanel.show) .tab {
          left: 380px;
     }
    
          </style>     
     </head>
     <body>
          <div id="banner"></div>
          <button id="settingsBtn">☰</button>
            <div id = "sideTabs">
               <div class = "tab" data-panel="todoPanel">
                    <span class = "tabLabel"> To do </span>
          </div>
          <div class = "tab" data-panel= "flashPanel">
               <span class = "tabLabel"> FlashCards </span>
           </div>
          </div>
          <div id = "todoPanel" class = "sidePanel">
               <h3> To-do List</h3>
               <input type = "text" id = "todoinput" placeholder = "Add a task..">
               <button id = "todoAdd">Add</button>
               <ul id = "todoList"></ul>
          </div>
          <div id = "flashPanel" class = "sidePanel">
               <H3> FLASHCARDS </H3>
               <p id = "flashQuestion"> No cards yet — add one below </p>
               <button id = "flashFlip"> Flip </button>
               <button id = "flashNext"> Next </button>
               <p id = "flashCounter"></p>
               <hr> 
               <h4>Add a card</h4>
               <input type = "text" id = "cardQ" placeholder="Question..">
               <input type = "text" id = "cardA" placeholder= "Answer..">
               <button id = "cardAdd"> Add card</button>
               <button id = "cardDelete"> Delete Card </button>
               <ul id = "cardList"></ul>
          </div>
          <h4>the image above this is an image.</h4>
          <h1>A timer with all your personalised items. </h1>
          <div id="settingsPanel">
               <h3>Settings</h3>
          <div> 
               <label for="soundinput">alarmsound:</label>
             <input type="file" id="soundinput" accept="audio/*">
          </div>
          <div>
             <label for="lengthinput">defult length (minutes):</label>
             <input type="number" id="lengthinput">
          </div>
             <label for="themetoggle">White mode</label>
             <input type="checkbox" id="themetoggle">
          <div>
          <div> 
               <label for = "colorinput"> Pick your own colors! </label>
               <input type = "color" id = "colorinput" value = "#000000">
          </div>
             <label for="bannerinput">banner image:</label>
             <input type="file" id="bannerinput" accept="image/*">
           </div>
          </div>

          <h2 id="display"> 00:00 </h2>
          <div id = "progressBar">
               <div id = "progressFill"></div>
               <div id ="cat">🐈</div>
          </div>
          <Button id = "startBtn"> Start </Button>
          <Button id = "stopBtn">  Stop </Button>
          <button id = "pauseBtn"> Pause </button>
          <script>
          const themeToggle = document.getElementById("themetoggle");
          const colorinput = document.getElementById("colorinput");
          const display =document.getElementById("display");
          const startBtn =document.getElementById("startBtn");
          const stopBtn = document.getElementById("stopBtn");
          const pauseBtn = document.getElementById("pauseBtn");
          const btn =document.getElementById("settingsBtn");
          const panel =document.getElementById("settingsPanel");
          const bannerinput = document.getElementById("bannerinput");
          const banner =document.getElementById("banner");
          const lengthinput = document.getElementById("lengthinput");
          const progressfill = document.getElementById("progressFill");
          const cat = document.getElementById("cat");
          bannerinput.addEventListener("change", function() {
               const file = bannerinput.files[0];
               const ImageURL = URL.createObjectURL(file);
               banner.style.backgroundImage = "URL(" + ImageURL+ ")"
          });
          btn.addEventListener("click", function () {
               panel.classList.toggle("show");
          });
         
          themeToggle.addEventListener("change",function() {
               if (themeToggle.checked) {
                    document.body.style.backgroundColor = "white";
                    document.body.style.color = "#1e1e1e";
                    panel.style.backgroundColor = "white";
                    panel.style.color = "black";
                    banner.style.backgroundColor = "white";
                    banner.style.color = "black";
               } else {
                    document.body.style.backgroundColor = "black";
                    document.body.style.color = "white";
                    panel.style.backgroundColor = "#1e1e1e";
                    panel.style.color = "white";
                    banner.style.backgroundColor = "#1e1e1e";
                    banner.style.color = "white";
               }
               saveSettings()

               
          });
          function readableText(hex) {
               const r = parseInt(hex.slice(1,3), 16);
               const g =parseInt(hex.slice(3,5), 16);
               const b = parseInt(hex.slice(5,7), 16);
               const brightness =(r * 299 + g * 587 + b * 114) / 1000;
               return brightness > 140 ? "black" : "white";
          }
          const soundinput = document.getElementById("soundinput");
          let alarmAudio = null;

          soundinput.addEventListener("change", function (){
               const file = soundinput.files[0];
               if (!file) return;
               alarmAudio = new Audio(URL.createObjectURL(file));
               alarmAudio.loop = true;
               alarmAudio.volume = 1;
          })

          colorinput.addEventListener("input", function () {
               themeToggle.checked = false;
              const text = readableText(colorinput.value);
              document.body.style.backgroundColor = colorinput.value;
              document.body.style.color =text;
              panel.style.backgroundColor =colorinput.value;
              panel.style.color= text;
              banner.style.backgroundColor =colorinput.value;
              banner.style.color = text;
              savesettings();
          });

          function saveSettings() {
               localStorage.setItem("timerSettings", JSON.stringify( {
                    color: colorinput.value,
                    whiteMode: themeToggle.checked,
                    length: lengthinput.value
               }));
          }
          
          let timeleft = 0;
          let totalTime = 0;
          let interval = null;
          function showtime() {
               const mins = Math.floor(timeleft / 60 );
               const secs = timeleft % 60;
               display.textContent = String(mins).padStart(2,"0") + ":" + String(secs).padStart(2, "0");
               if (totalTime > 0) {
                    const percent = 100 - (timeleft / totalTime ) * 100;
                    progressfill.style.width = percent + "%";    
                    cat.style.left = percent + "%";
               }
          } 
          startBtn.addEventListener("click", function () {
               if (timeleft === 0) {
                    timeleft = Number(lengthinput.value) * 60
                    totalTime = timeleft
               }
               showtime()
               clearInterval(interval);
               interval = setInterval(function() {
                    if (timeleft > 0) {
                         timeleft = timeleft - 1;
                         showtime()

                    } else {
                         clearInterval(interval);
                         playAlarm();
                    }
               } , 1000);
          });
          
          pauseBtn.addEventListener("click",function() {
               clearInterval(interval);
          });
            
          
          
         stopBtn.addEventListener("click", function() {
          clearInterval(interval);
          timeleft = 0;
          totalTime = 0;
          progressfill.style.width = "0%";
          cat.style.left = "0%";
          showtime();
         });

         const saved =JSON.parse(localStorage.getItem("timerSettings") || "{}");
         if (saved.length) lengthinput.value = saved.length;
         if (saved.whiteMode) {
          themeToggle.checked = true;
          themeToggle.dispatchEvent(new Event("change"));
         } else if (saved.color) {
           colorinput.value = saved.color;
           colorinput.dispatchEvent(new Event("input"));
         }

         function playAlarm() {
          if (alarmAudio) {
               alarmAudio.currentTime = 0;
               alarmAudio.play().catch(function(){
                    beep();
               });
          } else {
               beep();
          }
          document.title = "TIME'S UP!";
         }

         function beep()  {
          const ctx = new AudioContext();
          const osc = ctx.createOscillator();
          const gain= ctx.createGain();
          osc.frequency.value = 0.6;
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start ();
          osc.stop(ctx.currentTime + 0.6);
         }

         pauseBtn.addEventListener("click", function () {
          clearInterval(interval);
          if (alarmAudio) { 
               alarmAudio.pause();
               alarmAudio.currentTime = 0;}
          });
          const tabs = document.querySelectorAll(".tab");
          const panels = document.querySelectorAll(".sidePanel");
          tabs.forEach(function (tab) {
               tab.addEventListener("click", function () {
                    const target = document.getElementById(tab.dataset.panel);
                    const isOpen = target.classList.contains("open");
                    panels.forEach(function (p) {p.classList.remove("open");});
                    tabs.forEach(function (t) {t.classList.remove("active");});
                    if (!isOpen) {
                         target.classList.add("open");
                         tab.classList.add("active");
                    }
               });
          });
          const flashQuestion = document.getElementById("flashQuestion");
          const flashFlip = document.getElementById("flashFlip");
          const flashNext = document.getElementById("flashNext");
          const flashCounter = document.getElementById("flashCounter");
          const cardQ = document.getElementById("cardQ");
          const cardA = document.getElementById("cardA");
          const cardAdd = document.getElementById("cardAdd");
          const cardDelete = document.getElementById("cardDelete");
          const cardList = document.getElementById("cardList");

          let cards = JSON.parse(localStorage.getItem("flashCards") || "[]");
          let cardIndex = 0;
          let showingAnswer = false;

          function saveCards() {
               localStorage.setItem("flashCards", JSON.stringify(cards));

          }
          function renderCard() {
               if (cards.length === 0) {
                    flashQuestion.textContent = "No cards yet — add one below.";
                    flashCounter.textContent = "";
                    return;
               }
               if(cardIndex >= cards.length) cardIndex = 0;
               const card = cards[cardIndex];
               flashQuestion.textContent = showingAnswer? card.a : card.q;
               flashCounter.textContent = "Card " + (cardIndex + 1) + " of " + cards.length;
           }
           function renderCardList() {
               cardList.innerHTML = "";
               cards.forEach(function (card, i) {
                    const li = document.createElement("li");
                    li.textContent = card.q;
                    li.style.cursor = "pointer";
                    li.addEventListener("click", function () {
                         cardIndex = i;
                         showingAnswer = false;
                         renderCard();
                    });
                    cardList.appendChild(li);
               });
           }        
           
           cardAdd.addEventListener("click", function () {
               const q = cardQ.value.trim();
               const a = cardA.value.trim();
               if (!q || !a ) {
                    alert("Fill in both Question and Answer.");  
                  return;
               }
               cards.push({ q: q , a: a });
               saveCards();
               cardQ.value = "";
               cardA.value = "";
               cardIndex= cards.length -1;
               showingAnswer = false;
               renderCard();
               renderCardList();

           });
           cardDelete.addEventListener("click", function () {
               if (cards.length === 0) return;
               cards.splice(cardIndex,1);
               saveCards();
               if (cardIndex >= cards.length) cardIndex = 0;
               showingAnswer= false;
               renderCard();
               renderCardList();
           });

          flashFlip.addEventListener("click", function () {
               if (cards.length === 0) return;
               showingAnswer = !showingAnswer;
               renderCard();
          });
          flashNext.addEventListener("click", function (){
               if (cards.length === 0) return;
               cardIndex = (cardIndex + 1) % cards.length;
               showingAnswer = false;
               renderCard();
          });
          renderCard();
          renderCardList();

          </script>
     </body>
     </html>
